## Settings file was created by plugin AdminQoL v1.0.9
## Plugin GUID: sighsorry.AdminQoL

[1 - General]

## Require the local player to be host or listed in the server admin list before AdminQoL commands run.
# Setting type: Boolean
# Default value: true
Require Server Admin = true

## Load AdminQoL.ItemSets.yml and inject those sets into Valheim's vanilla itemset command.
# Setting type: Boolean
# Default value: true
Load YAML Item Sets = true

[2 - Gameplay QoL]

## Suppress the top-left unlock popup queue used for new recipes, items, pieces, stations, materials, and trophies.
# Setting type: Boolean
# Default value: true
Suppress Unlock Notifications = true

## When unlock popups are suppressed, keep the unlock text in the MessageHud log.
# Setting type: Boolean
# Default value: true
Log Suppressed Unlocks = true

## Remove the VFX/SFX played when a skill gains a level.
# Setting type: Boolean
# Default value: true
Remove Skill Level Up Effects = true

## Remove the top-left or center message when a skill gains a level.
# Setting type: Boolean
# Default value: true
Remove Skill Level Up Alarm = true

## Equip and unequip items immediately instead of using Valheim's timed equip action.
# Setting type: Boolean
# Default value: true
Remove Equip Delay = true

## Admin-only. Ignore roof and exposure checks when using crafting stations. Fire requirements still apply.
# Setting type: Boolean
# Default value: true
Ignore Crafting Station Roof Requirement = true

## Admin-only. Prevent equipped armor durability loss caused by taking damage.
# Setting type: Boolean
# Default value: true
Prevent Durability Loss From Damage = true

## Admin-only. Prevent equipped item durability loss caused by attacking, blocking, building, repairing, or passive use drain.
# Setting type: Boolean
# Default value: true
Prevent Durability Loss From Use = true

[3 - Console Panel]

