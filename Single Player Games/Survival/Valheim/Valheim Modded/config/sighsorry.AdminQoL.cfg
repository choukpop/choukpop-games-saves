# Setting type: PanelVisualStyle
# Default value: Modern
# Acceptable values: Off, Wood, Modern
Panel Visual Style = Modern

## Keyboard shortcut that toggles ConsolePanel while Valheim's F5 console is visible.
# Setting type: KeyboardShortcut
# Default value: F6
Toggle Panel Key = F6

## Width of the command browser panel.
# Setting type: Single
# Default value: 900
Panel Width = 900

## Maximum height of the command browser panel. The panel shrinks if needed to preserve the fixed gap below the console.
# Setting type: Single
# Default value: 450
Panel Height = 450

## Bottom Y offset applied to Valheim's own console rect while the console panel is visible.
# Setting type: Single
# Default value: 120
Vanilla Console Bottom Offset = 120

## Unlock and show the mouse cursor while the F5 console panel is visible so category, command, and favorite buttons can be clicked.
# Setting type: Boolean
# Default value: true
Release Mouse Cursor = true

